name: Build Baihu AppStore

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "build-all.py"
      - "requirements.txt"
      - ".github/workflows/build-apps.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "build-all.py"
      - "requirements.txt"
      - ".github/workflows/build-apps.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: baihu-appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.11.1"

      - name: Install builder dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate JavaScript syntax
        run: find apps -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Reject committed credentials and runtime state
        run: |
          if find apps -type f \( -name '.iios-state.json' -o -name '*.log' -o -name '*.db' \) -print | grep -q .; then
            echo "Runtime state file detected"
            exit 1
          fi
          if grep -RIE 'eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}|cf_clearance=[A-Za-z0-9_-]{40,}' apps; then
            echo "Credential-shaped content detected"
            exit 1
          fi

      - name: Build catalog
        run: python build-all.py

      - name: Verify deterministic catalog
        run: python build-all.py --check

      - name: Commit generated catalog
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: rebuild app catalog [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: |
          mkdir -p _site
          cp apps.json _site/apps.json
          cp -R apps _site/apps

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
