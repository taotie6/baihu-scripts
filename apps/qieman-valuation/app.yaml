spec_version: "v1"
id: "qieman-valuation"
name: "且慢每日估值"
version: "1.0.0"
author: "taotie6"
category: "投资工具"
last_commit: "2026-10-21T00:00:00+08:00"
template:
  - tag: "QiemanValuation"
  - mise_languages: "python@3.12.11"
description: "抓取且慢指数估值与债券收益，整理后通过白虎原生通知推送，可选同步飞书多维表格。"
homepage: "https://qieman.com/idx-eval"
build_opts:
  force_setup: false
  skip_setup: false
  skip_sync: false
  overwrite_env: false
  overwrite_task: true
schedule_opts:
  schedule: "0 45 20 * * 1-5"
  random_range: 300
  timeout: 10
  retry_count: 1
  retry_interval: 60
sources:
  - id: "repo"
    source_type: "git"
    source_url: "https://github.com/taotie6/baihu-scripts.git"
    branch: "main"
    target_path: "repo"
setup:
  check: >-
    mise exec {mise_languages} -- python -c "import requests"
    && mise exec {mise_languages} -- python -m py_compile
    "{app_dir}/repo/apps/qieman-valuation/main/sync_qieman_valuation.py"
  install: |
    mise install {mise_languages}
    mise exec {mise_languages} -- python -m pip install -r "{app_dir}/repo/apps/qieman-valuation/main/requirements.txt"
    mise exec {mise_languages} -- python -m py_compile "{app_dir}/repo/apps/qieman-valuation/main/sync_qieman_valuation.py"
env_schema:
  - key: "QIEMAN_VALUATION_LIMIT"
    label: "估值榜单数量"
    type: "string"
    required: false
    default: "5"
    description: "通知中低估与高估榜单各显示多少个指数，范围 1-20。"
  - key: "QIEMAN_NOTIFY_MAX_LENGTH"
    label: "通知最大字符数"
    type: "string"
    required: false
    default: "3500"
  - key: "FEISHU_APP_ID"
    label: "飞书应用 App ID"
    type: "string"
    required: false
    description: "可选；不配置任何 FEISHU_* 变量时仅通过白虎通知推送。"
  - key: "FEISHU_APP_SECRET"
    label: "飞书应用 App Secret"
    type: "secret"
    required: false
    description: "可选；启用飞书同步时与 App ID、Table Token 一起配置。"
  - key: "FEISHU_TABLE_TOKEN"
    label: "飞书多维表格 Token"
    type: "secret"
    required: false
    description: "可选；多维表格 app_token，或 FEISHU_TOKEN_TYPE=wiki 时填写 Wiki 节点 Token。"
  - key: "FEISHU_TOKEN_TYPE"
    label: "飞书 Token 类型"
    type: "string"
    required: false
    default: "bitable"
    description: "bitable 或 wiki。"
sync_rules:
  defaults:
    timeout: 10
    retry_count: 1
    retry_interval: 60
    work_dir: "{app_dir}/repo/apps/qieman-valuation/main"
    language: "{mise_languages}"
  tasks:
    - id: "sync-qieman-valuation"
      name: "且慢每日估值"
      source: "repo"
      language: "{mise_languages}"
      command: "python sync_qieman_valuation.py"
      default_cron: "0 45 20 * * 1-5"
      enabled: true
scenarios:
  - id: "notify-only"
    name: "白虎通知"
    description: "工作日 20:45 获取并整理估值数据，通过白虎原生通知推送。"
    default: true
    task_presets:
      sync-qieman-valuation:
        enabled: true
        cron: "0 45 20 * * 1-5"
  - id: "notify-and-feishu"
    name: "白虎通知 + 飞书"
    description: "配置全部 FEISHU_* 变量后，在通知之外同步每日指数估值和每日债券收益。"
    task_presets:
      sync-qieman-valuation:
        enabled: true
        cron: "0 45 20 * * 1-5"
